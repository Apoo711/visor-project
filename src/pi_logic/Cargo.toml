[package]
name = "rpi"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23"

# Headless browser automation
chromiumoxide = "0.9"
cpal = "0.18.2"
env_logger = "0.11.11"
futures-util = "0.3"

# Image handling / base64 encoding
image = "0.25"

# Logging Frameworks
log = "0.4.33"

# HTTP client & JSON handling for the Gemini API
reqwest = { version = "0.13", features = ["json", "query"] }
rustpotter = "3.0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hardware / Serial comms with Arduino
serialport = "4.3"
# Async runtime for non-blocking API calls & loops
tokio = { version = "1.0", features = ["full"] }
tokio-serial = "5.5.0"

# Target-specific high-performance memory allocators
[target.aarch64-unknown-linux-gnu.dependencies]
tikv-jemalloc-ctl = "0.7"
tikv-jemallocator = { version = "0.7", features = ["background_threads", "unprefixed_malloc_on_supported_platforms"] }

[target.x86_64-pc-windows-msvc.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
