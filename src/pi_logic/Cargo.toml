[package]
name = "rpi"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23"

# Headless browser automation
chromiumoxide = "0.9"
env_logger = "0.11.11"
futures-util = "0.3"

# Image handling / base64 encoding
image = "0.25"

# Logging Frameworks
log = "0.4.33"

# HTTP client & JSON handling for the Gemini API
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hardware / Serial comms with Arduino
serialport = "4.3"
# Async runtime for non-blocking API calls & loops
tokio = { version = "1.0", features = ["full"] }
tokio-serial = "5.5.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
